<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>محل السماطي - البيع بالسراول</title>
  <style>
    :root{--accent:#0f766e;--muted:#666}
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans Arabic',Tahoma;direction:rtl;margin:0;background:#f7f7f8;color:#111}
    header{background:linear-gradient(90deg,var(--accent),#065f5a);color:#fff;padding:18px}
    .container{max-width:1100px;margin:20px auto;padding:0 16px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand h1{font-size:20px;margin:0}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
    .card{background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(15,118,110,0.08);overflow:hidden}
    .card img{width:100%;height:220px;object-fit:cover;display:block}
    .card .body{padding:12px}
    .price{font-weight:700;color:var(--accent);margin-top:8px}
    .btn{display:inline-block;padding:8px 12px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;border:none;cursor:pointer}
    .muted{color:var(--muted);font-size:14px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .search{padding:8px;border-radius:8px;border:1px solid #e6e6e6;width:100%;max-width:360px}
    .cart-btn{position:relative}
    .badge{position:absolute;right:-8px;top:-8px;background:#ef4444;color:#fff;padding:4px 7px;border-radius:999px;font-size:13px}
    /* cart drawer */
    .drawer{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;justify-content:flex-end;pointer-events:none}
    .drawer .panel{width:360px;background:#fff;box-shadow:0 20px 60px rgba(2,6,23,0.2);pointer-events:auto;padding:16px;transform:translateX(100%);transition:transform .26s}
    .drawer.open .panel{transform:translateX(0)}
    .cart-item{display:flex;gap:12px;align-items:center;border-bottom:1px dashed #eee;padding:8px 0}
    .cart-item img{width:64px;height:64px;object-fit:cover;border-radius:6px}
    footer{padding:24px;text-align:center;color:var(--muted)}
    @media (max-width:600px){.card img{height:180px}.drawer .panel{width:100%}}
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="brand">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" rx="6" fill="#fff" opacity="0.06"/><path d="M7 12h10" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 8h10" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>
          <h1>سماطي السراول — المتجر الصغير</h1>
          <div class="muted">بيع مباشر و تسليم محلي — الدفع عبر Whatsapp</div>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top:18px">
    <div class="topbar" style="margin-bottom:18px">
      <input id="search" class="search" placeholder="قلب على الموديل، اللون، أو القياس..." />
      <div style="display:flex;gap:8px;align-items:center">
        <button id="open-cart" class="btn cart-btn">السلة <span id="cart-count" class="badge" style="display:none">0</span></button>
      </div>
    </div>

    <section>
      <div class="grid" id="products"></div>
    </section>
  </main>

  <div class="drawer" id="drawer">
    <div class="panel">
      <h3>السلة ديالك</h3>
      <div id="cart-items" style="margin-top:12px"></div>
      <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="muted">المجموع</div>
          <div id="cart-total" style="font-weight:800;font-size:18px">0 د.م</div>
        </div>
        <div>
          <button id="checkout-wa" class="btn">أطلب عبر Whatsapp</button>
        </div>
      </div>
      <div style="margin-top:12px;text-align:left"><button id="close-cart" class="btn" style="background:#e6e6e6;color:#111">سدو</button></div>
    </div>
  </div>

  <footer>
    صنع خصيصاً ليك — تواصل معنا فـ Whatsapp: <span id="wh-number">+212600000000</span>
  </footer>

  <script>
    // ======= بيانات المنتجات =======
    const PRODUCTS = [
      {id:1,name:'سماطي كلاسيك - اسود',price:120,desc:'قماش مريح، متوفر من S لـ XL',img:'https://via.placeholder.com/600x600?text=Black+Smaati'},
      {id:2,name:'سماطي رياضي - رمادي',price:140,desc:'مثالي للرياضة و الراحة',img:'https://via.placeholder.com/600x600?text=Grey+Smaati'},
      {id:3,name:'سماطي مودرن - كحلي',price:160,desc:'ستايل عصري وقصّة حديثة',img:'https://via.placeholder.com/600x600?text=Navy+Smaati'}
    ];

    // الرقم ديال Whatsapp اللي غادي توصّل عليه الطلب. بدلو لهاتش.
    const WH_NUMBER = '+212600000000';

    // ======= منطق العرض و السلة =======
    const productsEl = document.getElementById('products');
    const cart = {};

    function formatMAD(n){return n.toLocaleString('en-US') + ' د.م'}

    function renderProducts(list){
      productsEl.innerHTML = '';
      list.forEach(p=>{
        const card = document.createElement('div'); card.className='card';
        card.innerHTML = `
          <img src="${p.img}" alt="${p.name}" />
          <div class="body">
            <h4 style="margin:0">${p.name}</h4>
            <div class="muted">${p.desc}</div>
            <div class="price">${formatMAD(p.price)}</div>
            <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
              <select id="size-${p.id}"><option>م</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
              <button class="btn" onclick="addToCart(${p.id})">ضيف للسلة</button>
            </div>
          </div>
        `;
        productsEl.appendChild(card);
      })
    }

    function addToCart(id){
      const prod = PRODUCTS.find(x=>x.id===id);
      const size = document.getElementById('size-'+id).value || '';
      const key = id + '|' + size;
      if(!cart[key]) cart[key] = {...prod,qty:0,size}
      cart[key].qty++;
      updateCartUI();
      openCart();
    }

    function updateCartUI(){
      const itemsEl = document.getElementById('cart-items');
      itemsEl.innerHTML = '';
      let total = 0; let count=0;
      Object.values(cart).forEach(item=>{
        count += item.qty; total += item.qty * item.price;
        const d = document.createElement('div'); d.className='cart-item';
        d.innerHTML = `
          <img src="${item.img}" />
          <div style="flex:1;text-align:right">
            <div style="font-weight:700">${item.name}</div>
            <div class="muted">القياس: ${item.size}</div>
            <div class="muted">${item.qty} × ${formatMAD(item.price)}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <button class="btn" onclick="changeQty('${encodeURIComponent(item.name)}','${item.size}',1)">+</button>
            <button class="btn" style="background:#ef4444" onclick="changeQty('${encodeURIComponent(item.name)}','${item.size}',-1)">-</button>
          </div>
        `;
        itemsEl.appendChild(d);
      })
      document.getElementById('cart-total').innerText = formatMAD(total);
      const badge = document.getElementById('cart-count');
      if(count>0){badge.style.display='inline-block';badge.innerText=count}else badge.style.display='none';
    }

    function changeQty(encodedName,size,delta){
      const name = decodeURIComponent(encodedName);
      // find key
      const key = Object.keys(cart).find(k=>cart[k].name===name && cart[k].size===size);
      if(!key) return;
      cart[key].qty += delta;
      if(cart[key].qty<=0) delete cart[key];
      updateCartUI();
    }

    // ======= البحث =======
    document.getElementById('search').addEventListener('input',e=>{
      const q = e.target.value.trim().toLowerCase();
      renderProducts(PRODUCTS.filter(p=> (p.name+ ' ' + p.desc).toLowerCase().includes(q)));
    })

    // ======= Drawer =======
    const drawer = document.getElementById('drawer');
    document.getElementById('open-cart').addEventListener('click',openCart);
    document.getElementById('close-cart').addEventListener('click',closeCart);
    function openCart(){drawer.classList.add('open');updateCartUI();}
    function closeCart(){drawer.classList.remove('open');}

    // ======= Checkout via Whatsapp =======
    document.getElementById('checkout-wa').addEventListener('click',()=>{
      const lines = [];
      let total=0;
      Object.values(cart).forEach(it=>{lines.push(`${it.qty} x ${it.name} (قياس:${it.size}) = ${it.qty*it.price} د.م`); total += it.qty*it.price});
      if(lines.length===0){alert('السلة خاوية! ضيف شي حاجة أولاً.');return}
      lines.push('----------------');
      lines.push('المجموع: ' + total + ' د.م');
      const msg = encodeURIComponent('السلام عليكم، بغيت نطلب هاد المنتوجات:\n' + lines.join('\n'));
      const url = `https://wa.me/${WH_NUMBER.replace(/\+/g,'')}?text=${msg}`;
      window.open(url,'_blank');
    })

    // ======= init =======
    renderProducts(PRODUCTS);
  </script>
</body>
</html>
